[pytest]
testpaths = tests
# Plain `pytest` runs only what needs no hardware; `-m sliceN` overrides this.
addopts = -m sim
markers =
    sim: runs without hardware (simulators, parsers)
    slice0: listen only
    slice1: answer status
    slice2: IDENTIFY DEVICE
    slice3: read from a generated disk
    slice4: write to a RAM disk
    slice5: image file on SD
    slice6: housekeeping commands and soak
    activity: telling sequential from random activity (drive build)
    speed: throughput for the speed log (drive build)
    timing: how long the host really waits on IORDY (drive build, debug delay)
    link: the activity link's loopback (drive build, jumper from GPIO 0 to GPIO 1)
    card: the microSD card pulled out and put back while running (drive build, someone at the rig)
