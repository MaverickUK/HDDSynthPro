; HDDSynthPro IDE drive emulator prototype (C++ / Arduino-Pico)
;
;   pio run                 build the default (slice 0) -> .pio/build/bb48/firmware.uf2
;   pio run -t upload       build + flash over USB (BOOTSEL or auto-reset)
;   pio run -e bb48_drive -t upload    the drive build (slices 1-3)
;   pio device monitor      serial console (115200)

[platformio]
default_envs = bb48

[env:bb48]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = olimex_pico2bb48              ; RP2350B, 48 GPIO, 16 MB flash, no PSRAM
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0
; The test runner finds the serial port by this product name.
board_build.arduino.earlephilhower.usb_manufacturer = HDD Synth
board_build.arduino.earlephilhower.usb_product = HDDSynthPro
monitor_speed = 115200
build_flags =
    -O2
    -Wall

; The drive (slices 1-3): answers the bus, IDENTIFY, READ SECTORS from the
; generated 64 MB disk. Traces commands; console `t` adds raw accesses.
[env:bb48_drive]
extends = env:bb48
build_flags =
    ${env:bb48.build_flags}
    -DFIRMWARE_SLICE=3
