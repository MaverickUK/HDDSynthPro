; HDDSynthPro IDE drive emulator prototype (C++ / Arduino-Pico)
;
;   pio run                 build the default (slice 0) -> .pio/build/bb48/firmware.uf2
;   pio run -t upload       build + flash over USB (BOOTSEL or auto-reset)
;   pio run -e bb48_drive -t upload    the drive build (slices 1-5)
;   pio device monitor      serial console (115200)

[platformio]
default_envs = bb48

[env:bb48]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = olimex_pico2bb48              ; RP2350B, 48 GPIO, 16 MB flash, no PSRAM
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0
; 200 MHz instead of the RP2350's default 150 (certified by Raspberry Pi):
; core 1 answers every read in instructions, so a faster clock is headroom.
board_build.f_cpu = 200000000L
; The test runner finds the serial port by this product name.
board_build.arduino.earlephilhower.usb_manufacturer = HDD Synth
board_build.arduino.earlephilhower.usb_product = HDDSynthPro
monitor_speed = 115200
; src/welcome_text.h from welcome/README.TXT, the welcome disk's README.
extra_scripts = pre:scripts/embed_welcome.py
build_flags =
    -O2
    -Wall

; The drive (slices 1-5): answers the bus, IDENTIFY, READ and WRITE SECTORS on
; HDDSYNTH.IMG from the SD card, or else the generated 64 MB disk. Traces
; commands; console `t` adds raw accesses.
[env:bb48_drive]
extends = env:bb48
build_flags =
    ${env:bb48.build_flags}
    -DFIRMWARE_SLICE=3

; The drive as an ATAPI CD-ROM drive (docs/atapi.md; exploratory): serves the
; ISO HDDSYNTH.INI's `cdrom` names (HDDSYNTH.ISO by default) read-only, the
; generated test disc with `cdrom = none` or console `T`, or no disc. PIO only.
; The hard disk build (bb48_drive) is unchanged by it.
[env:bb48_cdrom]
extends = env:bb48
build_flags =
    ${env:bb48.build_flags}
    -DFIRMWARE_SLICE=3
    -DHDDPRO_CDROM=1

; The drive with a hard disk as device 0 and a CD-ROM drive as device 1
; (`device1 = cdrom`, or a device1 name ending in .ISO: hdcd::Device). Without
; a CD-ROM it serves what bb48_drive does, with one more branch per access;
; exploratory, so bb48_drive stays the hard disk build.
[env:bb48_hdcd]
extends = env:bb48
build_flags =
    ${env:bb48.build_flags}
    -DFIRMWARE_SLICE=3
    -DHDDPRO_HDCD=1
