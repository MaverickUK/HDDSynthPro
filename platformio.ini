; HDDSynthPro IDE drive emulator prototype (C++ / Arduino-Pico)
;
;   pio run                 build the default (slice 0) -> .pio/build/bb48/firmware.uf2
;   pio run -t upload       build + flash over USB (BOOTSEL or auto-reset)
;   pio run -e bb48_drive -t upload    the drive build (slices 1-5)
;   pio device monitor      serial console (115200)

[platformio]
default_envs = bb48

[env:bb48]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = olimex_pico2bb48              ; RP2350B, 48 GPIO, 16 MB flash, no PSRAM
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0
; 200 MHz instead of the RP2350's default 150 (certified by Raspberry Pi):
; core 1 answers every read in instructions, so a faster clock is headroom.
board_build.f_cpu = 200000000L
; The test runner finds the serial port by this product name.
board_build.arduino.earlephilhower.usb_manufacturer = HDD Synth
board_build.arduino.earlephilhower.usb_product = HDDSynthPro
monitor_speed = 115200
; src/welcome_text.h from welcome/README.TXT, the welcome disk's README; and
; core 1's hard disk code first in RAM, in a fixed order (core1_layout.py).
extra_scripts =
    pre:scripts/embed_welcome.py
    post:scripts/core1_layout.py
build_flags =
    -O2
    -Wall

; The drive (slices 1-5): answers the bus, IDENTIFY, READ and WRITE SECTORS on
; HDDSYNTH.IMG from the SD card, or else the generated 64 MB disk. By
; HDDSYNTH.INI also a second disk or a CD-ROM drive as device 1, or a CD-ROM
; drive alone (docs/atapi.md; up to 0.31.0 the builds bb48_cdrom and
; bb48_hdcd). Traces commands; console `t` adds raw accesses.
[env:bb48_drive]
extends = env:bb48
build_flags =
    ${env:bb48.build_flags}
    -DFIRMWARE_SLICE=3

; The drive on the HDDSynthPro PCB (hardware/, rev 0.3): bb48_drive with the
; SD card on 4-bit SDIO (about four times SPI's speed; pio_plan.h shares out
; the PIO blocks), card detect on GPIO 40. The PCB keeps the BB48's GPIOs.
; The BB48 builds stay on SPI: SDIO failed on its hand-wired leads.
[env:pcb_drive]
extends = env:bb48
build_flags =
    ${env:bb48.build_flags}
    -DFIRMWARE_SLICE=3
    -DHDDPRO_PCB=1
