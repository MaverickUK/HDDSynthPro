# Build the firmware and run every test that needs no hardware, on each push
# and pull request. A tag vX.Y.Z also publishes a GitHub release with the
# UF2, after checking that the tag matches FIRMWARE_VERSION in src/version.h.
name: Build and test

on:
  push:
    branches: [main, two-drives, merge-cdrom, hdd-cd]
    tags: ['v*']
  pull_request:

jobs:
  build:
    name: Firmware and host tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio -r host/requirements.txt

      # Builds first: it installs pioasm, which the PIO simulator tests use.
      - run: pio run -e bb48 -e bb48_drive -e bb48_cdrom -e bb48_hdcd
      - name: Core 1 runs only from RAM
        run: |
          python3 scripts/check_core1_ram.py
          python3 scripts/check_core1_ram.py .pio/build/bb48_cdrom/firmware.elf
          python3 scripts/check_core1_ram.py .pio/build/bb48_hdcd/firmware.elf
      - name: C++ unit tests
        run: test/run_native_tests.sh
      - name: Folder drive image, checked by fsck.fat, mtools and pyfatfs
        shell: bash
        run: |
          set -o pipefail
          sudo apt-get install -y -q dosfstools mtools > /dev/null
          pip install -q pyfatfs "setuptools<81"  # pyfatfs's fs package still imports pkg_resources
          mkdir -p "/tmp/folder/Sub Folder/Deeper Still" /tmp/folder/Empty
          cp -r docs /tmp/folder/Docs
          cp src/*.cpp "/tmp/folder/Sub Folder/"
          cp src/*.h "/tmp/folder/Sub Folder/Deeper Still/"
          head -c 5000001 /dev/urandom > /tmp/folder/random.bin
          : > /tmp/folder/empty.txt
          # Each check runs even if one before it failed; a failing one's
          # output becomes an annotation on the run, readable without logs.
          failed=0
          check() {
            local name="$1"; shift
            if "$@" > /tmp/check.out 2>&1; then
              tail -20 /tmp/check.out
            else
              cat /tmp/check.out
              echo "::error title=$name failed::$(head -c 3000 /tmp/check.out | sed -e ':a;N;$!ba' -e 's/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
              failed=1
            fi
          }
          check make_folder_img .pio/native-tests/make_folder_img /tmp/folder /tmp/folder.img
          dd if=/tmp/folder.img of=/tmp/partition.img bs=512 skip=63 status=none
          check fsck.fat fsck.fat -n -v /tmp/partition.img
          check mtools mdir -i /tmp/partition.img -/ ::
          check pyfatfs python3 scripts/check_folder_img.py /tmp/folder /tmp/folder.img
          exit $failed
      - name: Simulator and parser tests
        working-directory: host
        run: pytest -m sim

      - name: Read the firmware version
        id: version
        run: |
          version=$(sed -n 's/.*FIRMWARE_VERSION "\(.*\)".*/\1/p' src/version.h)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Firmware version $version"

      - name: Check the tag matches the firmware version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match FIRMWARE_VERSION ${{ steps.version.outputs.version }} in src/version.h"
            exit 1
          fi

      - name: Name the UF2s
        run: |
          mkdir dist
          cp .pio/build/bb48/firmware.uf2 "dist/hddsynthpro-bb48-listen-v${{ steps.version.outputs.version }}.uf2"
          cp .pio/build/bb48_drive/firmware.uf2 "dist/hddsynthpro-bb48-drive-v${{ steps.version.outputs.version }}.uf2"
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-v${{ steps.version.outputs.version }}
          path: dist/*.uf2

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware-v${{ needs.build.outputs.version }}
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.uf2 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
